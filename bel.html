<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bellen</title>
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#eaf4f3;color:#252661;font:16px -apple-system,system-ui,sans-serif;text-align:center}
  a{display:inline-flex;align-items:center;gap:8px;margin-top:16px;padding:14px 22px;border-radius:14px;background:#0e748e;color:#fff;font-weight:700;text-decoration:none}
  p{margin:0 24px;color:#4f6377}
</style>
</head>
<body>
<div>
  <p id="msg">Contact opzoeken…</p>
  <a id="go" href="shortcuts://run-shortcut?name=Aruna%20bel">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z"/></svg>
    <span id="lbl">Bellen</span>
  </a>
</div>
<script>
  // Naam komt uit de link: bel.html?n=Dries%20Peeters. Enkel tekst, nooit markup.
  var n = (new URLSearchParams(location.search).get('n') || '').replace(/[^\p{L}\p{N} .'\-]/gu, '').trim().slice(0, 60);
  var url = 'shortcuts://run-shortcut?name=' + encodeURIComponent('Aruna bel') + (n ? '&input=text&text=' + encodeURIComponent(n) : '');
  document.getElementById('go').href = url;
  if (n) { document.getElementById('lbl').textContent = 'Bel ' + n; document.getElementById('msg').textContent = n + ' opzoeken in je contacten…'; }
  location.href = url;
</script>
</body>
</html>
